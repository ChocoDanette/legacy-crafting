name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Read the version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match mod_version ${version} in gradle.properties. Use the tag v${version}, or run this workflow from the Actions tab."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build
        run: gradle build --stacktrace
      - name: Extract the changelog section of this version
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          title="Legacy Crafting ${VERSION}"
          # A release made by hand on github.com already exists: add the jar and notes to it.
          if gh release view "${tag}" > /dev/null 2>&1; then
            gh release upload "${tag}" build/libs/legacycrafting-*.jar --clobber
            gh release edit "${tag}" --title "${title}" --notes-file release-notes.md
          else
            gh release create "${tag}" build/libs/legacycrafting-*.jar --target "${GITHUB_SHA}" --title "${title}" --notes-file release-notes.md
          fi
